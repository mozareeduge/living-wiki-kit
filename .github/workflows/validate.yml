name: Validate Wiki

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r requirements-governance.txt pytest
      - name: Validate against the accepted baseline
        run: python scripts/check_against_baseline.py
      - name: Test suite (validators, gates, context compiler, candidate layer, reconciliation)
        run: python -m pytest tests scripts/tests -q
