name: Validate Wiki

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r requirements-governance.txt pytest
      - name: Validate against the accepted baseline
        run: python scripts/check_against_baseline.py
      # One command per step, no forced shell: runs the same under bash on
      # GitHub-hosted Linux and PowerShell on a self-hosted Windows runner,
      # and every command's exit code fails the job.
      - name: "Kernel gate: wiki_validate"
        run: python scripts/wiki_validate.py --repo . --format json
      - name: "Kernel gate: wiki_state check"
        run: python scripts/wiki_state.py --repo . check
      - name: "Kernel gate: wiki_evidence check"
        run: python scripts/wiki_evidence.py --repo . check
      - name: "Kernel gate: wiki_profiles check"
        run: python scripts/wiki_profiles.py check
      - name: Test suite (validators, gates, context compiler, candidate layer, reconciliation, capture)
        run: python -m pytest tests scripts/tests scripts/capture/tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Field archive projection and candidate boundaries
        run: node --test tools/obsidian-living-wiki-field/model.test.js

  fresh-wiki:
    # Release gate (Q6): a brand-new wiki made from this commit passes every
    # gate, census included, and re-instantiating it changes nothing.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r requirements-governance.txt
      - name: Instantiate a fresh wiki and run every gate in it
        run: python scripts/release_smoke.py
